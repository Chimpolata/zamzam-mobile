name: Validate mobile

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo-doctor
      - run: npx expo export --platform android --output-dir /tmp/zamzam-android-export

